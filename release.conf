# release.conf — konfigurace pro `mac-release` (~/Development/mac-release).
#
# Popisuje, ČÍM SE TENHLE PROJEKT STAVÍ; „jak se releasuje“ je v nástroji.
# Vydání: `cd ~/Development/sops-macos-gui && release <verze>`.
#
# ŽÁDNÉ SECRETY. Podpisová identita, notarizační klíč a EdDSA klíč žijí mimo
# repo (`~/.config/mac-release/env`, chmod 600) a v keychainu. Tady je jen
# JMÉNO keychain účtu, což tajné není.

DRIVER="swift-xcodegen"
FEED="sparkle"

APP_NAME="SopsGUI"

# MARKETING_VERSION z project.yml. Je to JEDINÝ zdroj verze v celém repu:
# Info.plist má `CFBundleShortVersionString: "$(MARKETING_VERSION)"`, takže
# co je tady, to je i v bundlu — verzi nejde změnit na jednom místě a zapomenout
# na druhé. (Před 0.1.0 tu byla natvrdo `1.0` v Info.plistu a žádný release
# proces ji neviděl.)
VERSION_CMD='grep -E "MARKETING_VERSION:" project.yml | head -1 | sed -E "s/.*\"([^\"]+)\".*/\1/"'

# project.yml i .xcodeproj leží v kořeni repa.
BUILD_DIR="."
DIST_DIR="dist"

# Go bridge (`Engine/`) se staví MIMO Xcode: `Package.swift` na něj odkazuje
# jako na `.binaryTarget` v `Engine/build/SopsBridge.xcframework`, a ten je
# gitignorovaný. Musí tedy vzniknout DŘÍV, než xcodebuild začne.
#
# Pouští se VŽDY, i když už build/ existuje. Ta appka dešifruje cizí tajemství
# kódem z tohohle archivu; pár desítek sekund navíc je levnější než riziko, že
# se do podepsaného vydání dostane engine z jiného commitu, než jaký se právě
# taguje. Skript si `build/` maže sám (`rm -rf`), takže výsledek je vždy
# z aktuálního zdroje.
PREBUILD_CMD="Engine/build-xcframework.sh"

# ENTITLEMENTS se schválně NEUVÁDÍ, a to je tvrzení, ne opomenutí.
#
# Appka běží pod hardened runtime (`ENABLE_HARDENED_RUNTIME: YES`) a nepotřebuje
# ani jednu z jeho výjimek: engine je statický Go c-archive slinkovaný přímo do
# hlavní binárky (ADR 0001) — žádný JIT, žádná unsigned executable memory,
# žádná dlopen cizí knihovny. ui-tester ty výjimky má kvůli embedded Nodu; tady
# by každá byla jen díra v hardened runtime u aplikace, jejíž celá práce jsou
# tajemství.
#
# Sandbox taky ne, a taky vědomě: uživatel na tuhle appku ukazuje vlastní repa
# kdekoli na disku a sops si sám vybírá cestu ke key filu. App Sandbox by na to
# potřeboval security-scoped bookmarks — reálná práce a reálné rozhodnutí,
# ne build flag. Zapsáno, ne přeskočeno.

# Sparkle `Downloader.xpc` appka nepotřebuje (používá ho jen sandboxovaná
# aplikace) a táhne deprecated WebView. Maže se před podpisem — stejně jako
# u ui-testeru. Neexistující cesta = tvrdá chyba (např. po změně layoutu
# Sparkle z Versions/B), ne tiché přeskočení.
PRUNE_PATHS="Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices/Downloader.xpc"

# EXTRA_SIGN_GLOBS se neuvádí: kromě Sparkle.frameworku (ten podepisuje driver
# jako součást bundlu) v .app žádná další samostatná binárka není — ověřeno
# `find … -perm +111` na hotovém bundlu. Go engine je slinkovaný dovnitř.

# Zdrojový repo je PRIVÁTNÍ; ven jde jen DMG, ZIP a appcast, a to do
# samostatného VEŘEJNÉHO repa. Sparkle nemá jak číst appcast z privátního repa,
# takže feed bydlí tam — SUFeedURL v project.yml ukazuje na raw URL níž.
RELEASE_REPO="ivan-mihalic/sops-macos-gui-releases"
FEED_REPO="ivan-mihalic/sops-macos-gui-releases"
FEED_PATH="appcast.xml"
# `-releases` repo vzniklo s `master` a bylo přejmenováno na `main`. Uvedeno
# explicitně, ať to nezávisí na defaultu ani na MAIN_BRANCH tohohle repa (to je
# `master`, viz níž — ty dva se tady liší).
FEED_BRANCH="main"
VERIFY_FEED_URL="https://raw.githubusercontent.com/ivan-mihalic/sops-macos-gui-releases/main/appcast.xml"

# Feed repo je veřejné → feed i archiv MUSÍ jít stáhnout bez credentials.
# Selhání anonymní cesty je tvrdá chyba: přesně tak to vidí uživatel.
FEED_PUBLIC="1"

# Enclosure v appcastu = VEŘEJNÁ browser download URL, ne API URL assetu.
# `App/Updater.swift` nenastavuje `httpHeaders`, takže Sparkle stahuje archiv
# s `Accept: */*` — a na tu hlavičku vrátí GitHub asset API stav 200 a JSON
# metadata místo archivu; klient by spadl na délce i na EdDSA podpisu a ohlásil
# „update failed“. Funguje to proto, že `-releases` repo je veřejné (preflight
# to ověřuje).
ENCLOSURE_URL_STYLE="browser"

# <link> v položkách feedu.
FEED_LINK="https://github.com/ivan-mihalic/sops-macos-gui-releases"

# Keychain účet s EdDSA klíčem tohohle projektu (veřejná půlka = SUPublicEDKey
# v project.yml). Vlastní pár, ne sdílený s ui-testerem: kompromitace jednoho
# klíče pak nedovolí podepsat update té druhé aplikaci.
SPARKLE_KEY_ACCOUNT="sops-macos-gui"

# Poznámka k tomu účtu, protože to stálo hodinu: keychain se při každém vydání
# ptal na heslo a "Always Allow" nepomáhalo. Příčina byla, že mac-release bral
# `generate_appcast` a `sign_update` z `build/SourcePackages/artifacts/…`, tedy
# z derived data. Obě binárky jsou ad-hoc podepsané bez TeamID, takže ACL
# záznam v klíčence se váže na konkrétní binárku na konkrétní cestě — a ta
# cesta se smazáním `build/` ztratí. Navíc jsou to DVĚ binárky, takže i kdyby
# grant držel, jeden "Always Allow" pokryje jen půlku.
#
# Vyřešeno mimo repo (nastavení stroje, ne projektu):
#   - kopie nástrojů v `~/.local/libexec/sparkle/` (stabilní cesta)
#   - `MR_SPARKLE_BIN_DIR` na ni ukazuje v `~/.config/mac-release/env`
#   - ACL položky přepsáno `security add-generic-password -U -T <každý nástroj>`
# Ověřeno: obě binárky klíč přečtou bez dialogu.
#
# Při upgradu Sparkle je nutné kopie v `~/.local/libexec/sparkle/` obnovit
# A ZNOVU nastavit ACL — jiná binárka = jiný grant.

# Hlavní branch tohohle repa je `master`, ne `main` (default nástroje).
MAIN_BRANCH="master"

# PUSH_TAG se neuvádí (default 1) — tag `v<verze>` se pushuje i sem, do
# zdrojového repa, jako záznam „tenhle commit je vydaný“. V repu není žádný
# GitHub Actions workflow spouštěný pushem tagu, takže druhý build to nerozjede
# (ověřeno: `.github/` tu vůbec není).
