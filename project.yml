name: SopsGUI
options:
  bundleIdPrefix: cz.mihalic
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.5.0"
    # Sparkle compares builds by CFBundleVersion (sparkle:version), so this has
    # to rise on every published build even when the marketing version does not.
    # Placeholder only — the real value is baked in by
    # `Scripts/bake-build-number.sh` after the build (`git rev-list --count
    # HEAD`). Do not raise this by hand; raising it here would go stale the
    # moment someone forgot, which is the failure it replaces.
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    ENABLE_HARDENED_RUNTIME: YES
    # SOPS-46 / SOPS-49. These two lines are a pair and must never be separated:
    # the entitlements file asks for `keychain-access-groups`, a restricted
    # entitlement, and AMFI SIGKILLs a binary carrying it without an embedded
    # provisioning profile that authorises it — before `main` runs, measured,
    # exit 137. The postbuild script below embeds that profile and fails the
    # build when it cannot. `EntitlementsWiringTests` fails the build if this
    # setting ever appears without a profile step. See ADR 0006.
    CODE_SIGN_ENTITLEMENTS: App/SopsGUI.entitlements
    # Manual, ne automatic: automatic signing by si při každém buildu sahalo na
    # Apple portál a mlčky měnilo, čím je appka podepsaná. Tenhle projekt má
    # jeden certifikát a jeden profil a chce, aby to bylo vidět v repu.
    #
    # `$(AppIdentifierPrefix)` v entitlements rozvine Xcode Z TOHOTO PROFILU.
    # `codesign` sám to neumí (naměřeno — do podpisu se dostane doslovný řetězec
    # a binárku to zabije stejně, jako by entitlement nebyl autorizovaný), takže
    # tady se podepisuje Xcode a release driver to pak jen přepodepíše týmiž
    # entitlements. Profil musí být nainstalovaný v
    # ~/Library/Developer/Xcode/UserData/Provisioning Profiles/ — dělá to
    # `Scripts/bootstrap.sh`.
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: NA99TRHL4B
    PROVISIONING_PROFILE_SPECIFIER: SOPS GUI Developer ID
    CODE_SIGN_IDENTITY: Developer ID Application
    # Art is generated by `Scripts/make-app-icon.swift`, not hand-drawn — see
    # that file. Without this setting the catalog compiles but nothing writes
    # `CFBundleIconName`, and the app shows the generic blank-page icon in the
    # Dock and in Finder.
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
packages:
  SopsGUIKit:
    path: Packages/SopsGUIKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  SopsGUI:
    type: application
    platform: macOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleName: SOPS GUI
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "26.0"
        # One source for the version. `release.conf`'s VERSION_CMD reads
        # MARKETING_VERSION below, and these two forward it into the bundle —
        # the same shape ui-tester uses. Before this the version was hardcoded
        # `1.0` in Info.plist, which no release process could see.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # The feed lives in the PUBLIC sops-macos-gui-releases repository
        # because this source repository is private and Sparkle cannot read a
        # feed it has to authenticate for.
        SUFeedURL: "https://raw.githubusercontent.com/ivan-mihalic/sops-macos-gui-releases/main/appcast.xml"
        # Public half of the EdDSA pair whose private half lives in this
        # machine's keychain under the account `sops-macos-gui`. Public by
        # definition — Sparkle uses it to verify that an archive was signed by
        # that key before it will install anything.
        SUPublicEDKey: "C+WU1rWFtdIP3f/qSw12EWcV7RqLSDn4D6A91/uishw="
        # No silent background checks: this app is about not doing things to
        # the user's machine behind their back, and an updater that phones home
        # on its own contradicts that. Settings › Updates already carries the
        # user's consent for the *engine* freshness check; the app updater asks
        # separately, on first run.
        SUEnableAutomaticChecks: false
    postbuildScripts:
      # Sparkle compares builds by CFBundleVersion, so it has to be a real
      # monotonic number rather than the placeholder in `settings`. See the
      # script.
      - name: "Bake build number and commit into Info.plist"
        basedOnDependencyAnalysis: false
        script: bash "$SRCROOT/Scripts/bake-build-number.sh"
      # SOPS-49. Must run for every build, not only for a release: a locally
      # built app without the profile does not launch either, and finding that
      # out at release time is finding it out too late.
      - name: "Embed the Developer ID provisioning profile"
        basedOnDependencyAnalysis: false
        script: bash "$SRCROOT/Scripts/embed-provisioning-profile.sh"
    dependencies:
      - package: Sparkle
      - package: SopsGUIKit
        product: SopsUI
      - package: SopsGUIKit
        product: SopsEngine
      - package: SopsGUIKit
        product: SopsHealth
      - package: SopsGUIKit
        product: SopsProjects
